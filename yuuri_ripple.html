<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ゆうりの 音と光の波紋あそび</title>
    <style>
        @keyframes breathe {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #fff0c8, #c8f0ff, #d6ffd6, #ffd6e7);
            background-size: 400% 400%;
            animation: breathe 18s ease infinite;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #back-btn {
            position: fixed;
            top: 12px;
            right: 16px;
            font-size: 2rem;
            background: rgba(255,255,255,0.5);
            border: none;
            border-radius: 50%;
            width: 52px;
            height: 52px;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        #startPrompt {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(0, 0, 0, 0.35);
            font-size: 1.5rem;
            pointer-events: none;
            transition: opacity 1s ease-out;
            text-align: center;
            z-index: 50;
        }

        .hidden { opacity: 0; }
    </style>
</head>
<body>

    <button id="back-btn" onclick="window.location.href='index.html'">⚙️</button>
    <div id="startPrompt">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 10px;">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="4"></circle>
        </svg>
        <br>さわって はじめる
    </div>

    <canvas id="rippleCanvas"></canvas>

    <script>
        const canvas = document.getElementById('rippleCanvas');
        const ctx = canvas.getContext('2d'); // alpha: true でCSS背景を透過させる
        const startPrompt = document.getElementById('startPrompt');

        // --- リサイズ ---
        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- 音響エンジン ---
        let audioCtx = null;

        const pentatonicScale = [
            261.63, 293.66, 329.63, 392.00, 440.00,
            523.25, 587.33, 659.25, 783.99, 880.00
        ];

        // iOSのAudioContext制約に対応：ユーザー操作の同期コンテキスト内で呼ぶこと
        function initAudio() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AC();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(x, volume = 0.3) {
            if (!audioCtx) return;

            const ratio = Math.max(0, Math.min(1, x / width));
            const freq = pentatonicScale[Math.min(Math.floor(ratio * pentatonicScale.length), pentatonicScale.length - 1)];

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.type = 'sine';
            osc.frequency.value = freq;

            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(volume, now + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

            osc.start(now);
            osc.stop(now + 2.5);
        }

        // --- 波紋クラス ---
        const ripples = [];

        class Ripple {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 0;
                this.targetRadius = Math.max(100, Math.min(width, height) * 0.3);
                this.alpha = 0.75;
                const hue = Math.floor(Math.max(0, Math.min(1, y / height)) * 300);
                this.color = `hsla(${hue}, 80%, 60%, {a})`;
                this.velocity = 0.04 + Math.random() * 0.03;
            }
            update() {
                this.radius += (this.targetRadius - this.radius) * this.velocity;
                this.alpha -= 0.01;
            }
            draw() {
                if (this.alpha <= 0) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = this.color.replace('{a}', this.alpha);
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.fillStyle = this.color.replace('{a}', this.alpha * 0.25);
                ctx.fill();
            }
        }

        // --- アニメーションループ ---
        function animate() {
            ctx.clearRect(0, 0, width, height); // CSS背景を活かすためclearRect
            for (let i = ripples.length - 1; i >= 0; i--) {
                ripples[i].update();
                ripples[i].draw();
                if (ripples[i].alpha <= 0) ripples.splice(i, 1);
            }
            requestAnimationFrame(animate);
        }
        animate();

        // --- インタラクション ---
        let isStarted = false;
        let lastMoveTime = 0;

        function handleInput(x, y, isMove = false) {
            if (!isStarted) {
                isStarted = true;
                startPrompt.classList.add('hidden');
            }
            if (isMove) {
                const now = Date.now();
                if (now - lastMoveTime < 150) return;
                lastMoveTime = now;
            }
            ripples.push(new Ripple(x, y));
            playSound(x);
        }

        // タッチ — initAudioをtouchstart内で同期呼び出し（iOS必須）
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            initAudio();
            resetIdleTimer();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                handleInput(t.clientX, t.clientY, false);
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            resetIdleTimer();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                handleInput(t.clientX, t.clientY, true);
            }
        }, { passive: false });

        // マウス（PC確認用）
        let isMouseDown = false;
        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            initAudio();
            resetIdleTimer();
            handleInput(e.clientX, e.clientY, false);
        });
        canvas.addEventListener('mousemove', (e) => {
            if (!isMouseDown) return;
            resetIdleTimer();
            handleInput(e.clientX, e.clientY, true);
        });
        canvas.addEventListener('mouseup', () => { isMouseDown = false; });
        canvas.addEventListener('mouseleave', () => { isMouseDown = false; });

        // --- 妖精のお誘いモード（Idle Auto-play）---
        let idleTimer = null;
        let idleInterval = null;

        function fairyRipple() {
            const x = Math.random() * width;
            const y = Math.random() * height;
            ripples.push(new Ripple(x, y));
            playSound(x, 0.18); // 通常の80%以下の音量
        }

        function startIdleMode() {
            if (idleInterval) return;
            fairyRipple();
            idleInterval = setInterval(() => {
                fairyRipple();
            }, 3000 + Math.random() * 1000); // 3〜4秒ランダム間隔
        }

        function resetIdleTimer() {
            // ユーザー操作でIdleをリセット
            clearTimeout(idleTimer);
            clearInterval(idleInterval);
            idleInterval = null;
            idleTimer = setTimeout(startIdleMode, 4000);
        }

        // ページ読み込み後4秒でIdleモード開始
        resetIdleTimer();
    </script>
</body>
</html>
