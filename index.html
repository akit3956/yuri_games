<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="no">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>ぽんぽん・ぱっ！ 〜ゆうりのおとあそび〜</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container"></div>

    <div id="menu-trigger" title="メニュー">⚙️</div>

    <div id="adult-menu" class="hidden">
        <div class="home-header">
            <p class="game-title">ぽんぽん・ぱっ！</p>
            <p class="game-subtitle">〜ゆうりのおとあそび〜</p>
        </div>
        <div class="menu-content">
            <p class="game-desc">あそびをえらんでね</p>
            <div class="btn-grid">
                <button class="game-select-btn" data-game="1">✨<br>キラキラ<br>ポンポン</button>
                <button class="game-select-btn" data-game="2">🐶<br>どうぶつ<br>いないばぁ</button>
                <button class="game-select-btn" data-game="3">🚗<br>のりもの<br>ブーブー</button>
                <button class="game-select-btn" data-game="4">📖<br>えほん<br>よんでね</button>
                <button class="game-select-btn" data-game="5">🎵<br>ゆうりの<br>音と光あそび</button>
            </div>
        </div>
    </div>


    <!-- 絵本選択オーバーレイ -->
    <div id="ehon-select" class="hidden">
        <p class="ehon-select-title">📚 えほんをえらんでね</p>
        <div class="ehon-select-books">
            <button class="ehon-select-btn" id="ehon-btn-yuri">📖<br>ゆうりのえほん</button>
            <button class="ehon-select-btn" id="ehon-btn-hajimete">📚<br>はじめてのえほん</button>
        </div>
        <button class="ehon-back-btn" id="ehon-back">← もどる</button>
    </div>

    <script src="app.js?v=23"></script>
</body>
</html>
